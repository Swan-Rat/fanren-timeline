<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>凡人修仙传·灵界 — 地图选点展示（实景图）</title>
<style>
/* ====== 令牌（与 灵界篇-纪传体时间线.html 同一套暖纸色系） ====== */
:root{
  --surface-1:#fdfcf8; --page:#f2f0e9; --card:#ffffff;
  --ink-1:#1b1916; --ink-2:#57534a; --ink-3:#6f6a5c;
  --grid:#e6e3d8; --baseline:#c8c4b6; --ring:rgba(27,25,22,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#d55181; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --gold:#d97706;
  --plane-wash:rgba(42,120,214,.07); --plane-edge:rgba(42,120,214,.24);
  --home-wash:rgba(137,135,129,.10);
  --sh-1:0 1px 2px rgba(27,25,22,.05),0 2px 8px rgba(27,25,22,.06);
  --sh-2:0 2px 6px rgba(27,25,22,.07),0 10px 26px rgba(27,25,22,.12);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --surface-1:#1d1c18; --page:#12110e; --card:#26251f;
    --ink-1:#f2f0ea; --ink-2:#c6c3b8; --ink-3:#8f8b7f;
    --grid:#2e2d28; --baseline:#3d3c35; --ring:rgba(255,255,255,.10);
    --s1:#4b93ec; --s2:#e86a33; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#2fa84f; --s7:#9085e9; --s8:#e66767;
    --gold:#f0a128;
    --plane-wash:rgba(75,147,236,.09); --plane-edge:rgba(75,147,236,.30);
    --home-wash:rgba(137,135,129,.14);
    --sh-1:0 1px 2px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.28);
    --sh-2:0 2px 6px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-1:#1d1c18; --page:#12110e; --card:#26251f;
  --ink-1:#f2f0ea; --ink-2:#c6c3b8; --ink-3:#8f8b7f;
  --grid:#2e2d28; --baseline:#3d3c35; --ring:rgba(255,255,255,.10);
  --s1:#4b93ec; --s2:#e86a33; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#2fa84f; --s7:#9085e9; --s8:#e66767;
  --gold:#f0a128;
  --plane-wash:rgba(75,147,236,.09); --plane-edge:rgba(75,147,236,.30);
  --home-wash:rgba(137,135,129,.14);
  --sh-1:0 1px 2px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.28);
  --sh-2:0 2px 6px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.45);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6}
/* 标题走宋体系衬线，与时间线页统一 */
h1,.panel h3,.m-ti{font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif}
.wrap{max-width:1560px;margin:0 auto;padding:0 18px 60px}
header{padding:30px 0 10px}
h1{font-size:25px;margin:0 0 6px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(115deg,var(--ink-1) 25%,var(--s1) 70%,var(--s3));
  -webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.sub{color:var(--ink-2);font-size:13px;margin:0;max-width:1200px}
.sub b{color:var(--ink-1)}
.sub a{font-weight:600}
a{color:var(--s1)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
.btn,.chip{border:1px solid var(--ring);background:var(--card);color:var(--ink-1);
  border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;line-height:1.5;
  box-shadow:var(--sh-1);transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:hover,.chip:hover{border-color:var(--baseline);transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn[aria-pressed="true"]{border-color:var(--s1);color:var(--s1)}
input.search{border:1px solid var(--ring);background:var(--card);color:var(--ink-1);
  border-radius:8px;padding:5px 11px;font-size:12px;width:200px;box-shadow:var(--sh-1)}
.chip{border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.hint{color:var(--ink-3);font-size:12px}
.maprow{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.card{background:var(--surface-1);border:1px solid var(--ring);border-radius:14px;
  overflow:hidden;box-shadow:var(--sh-1)}
.mapcard{flex:1 1 720px;min-width:0}
.mapcard svg{display:block;width:100%;height:auto}
.panel{flex:0 1 340px;min-width:300px;display:flex;flex-direction:column;
  background:var(--card)}
.panel .pbody{padding:12px 14px;overflow:auto;max-height:78vh;font-size:12.5px}
.panel h3{margin:0 0 2px;font-size:15px;font-weight:800}
.panel .reg{color:var(--ink-3);font-size:11.5px;margin-bottom:6px}
.panel .desc{color:var(--ink-2);margin:4px 0 8px}
.panel h4{margin:10px 0 4px;font-size:12px;color:var(--ink-1);font-weight:700;
  background:var(--home-wash);padding:2px 9px;border-radius:5px;width:fit-content}
.plist{display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:flex-start;gap:7px;padding:4px 6px;border-radius:6px;
  cursor:pointer;border:1px solid transparent;transition:background .15s}
.prow:hover{background:var(--home-wash)}
.prow .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;
  box-shadow:0 0 0 1.5px var(--card)}
.prow .nm{font-weight:700;font-size:12.5px}
.prow .sp{color:var(--ink-3);font-size:11px}
.prow.sel{border-color:var(--baseline);background:var(--home-wash)}
.evq{color:var(--ink-2);font-size:12px;padding:5px 8px;border-left:2px solid var(--s1);
  background:var(--surface-1);margin:4px 0;border-radius:0 6px 6px 0}
.evq b{color:var(--ink-1)}
.evq.clickable{cursor:pointer;transition:background .15s,border-color .15s}
.evq.clickable:hover{background:var(--card);border-left-color:var(--ink-1)}
.nlist{display:grid;grid-template-columns:1fr;gap:4px}
.nrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;
  cursor:pointer;font-size:12px;transition:background .15s}
.nrow:hover{background:var(--home-wash)}
.nrow .d{width:8px;height:8px;border-radius:50%;flex:none}
.nrow .t{color:var(--ink-3);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center;
  padding:12px 16px;border-top:1px solid var(--grid);font-size:12px;color:var(--ink-2);
  background:var(--card)}
.legend .it{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:50%;box-shadow:var(--sh-1)}
.legend .sec{font-weight:700;color:var(--ink-1);background:var(--home-wash);
  padding:2px 9px;border-radius:5px;font-size:11.5px;letter-spacing:.3px}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
th{color:var(--ink-3);font-weight:700;text-align:left;border-bottom:2px solid var(--grid);
  padding:5px 8px;font-size:11.5px;letter-spacing:.5px}
td{border-bottom:1px solid var(--grid);padding:5px 8px;vertical-align:top;color:var(--ink-2)}
td b{color:var(--ink-1)}
.tip{position:fixed;z-index:99;max-width:300px;background:var(--card);
  border:1px solid var(--ring);border-top:3px solid var(--s1);border-radius:10px;
  padding:8px 11px;box-shadow:var(--sh-2);font-size:12.5px;color:var(--ink-2);
  pointer-events:none;display:none}
.tip .t1{font-weight:700;color:var(--ink-1)}
svg text{font-family:inherit}
.node{cursor:pointer}
.node:focus-visible{outline:none}
.node:focus-visible .ndot,.node:focus-visible circle{stroke:var(--s1);stroke-width:3}
.node.dim{opacity:.12}
.node .ndot{stroke:var(--card);stroke-width:2}
.node.hl .ndot{stroke:var(--ink-1);stroke-width:2.5}
/* 描边改用令牌色：原来硬编码 #ffffff，深色模式下会留下刺眼白圈 */
.nlabel{font-size:12px;fill:var(--ink-1);font-weight:600;
  paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.nlabel.sub{font-size:10.5px;fill:var(--ink-2);font-weight:500}
.clabel{font-size:15px;font-weight:700;fill:var(--ink-3);letter-spacing:2px}
.route{pointer-events:none}
.planetag{font-size:11px;fill:var(--ink-1);font-weight:600}
.tablewrap{overflow-x:auto}          /* 窄屏横向滚动，避免三列被压到不可读 */
.tablewrap table{min-width:520px}
footer{max-width:1560px;margin:40px auto 0;padding:0 18px 48px;color:var(--ink-3);
  font-size:12px;line-height:1.8}

/* ====== 原文精炼弹窗 ====== */
.modal{display:none;position:fixed;inset:0;z-index:120;padding:24px;
  background:rgba(27,25,22,.45);backdrop-filter:blur(2px);
  align-items:flex-start;justify-content:center;overflow:auto}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--ring);border-top:3px solid var(--s1);
  border-radius:14px;box-shadow:var(--sh-2);width:min(620px,94vw);margin:auto 0;
  position:relative;animation:mpop .18s ease}
@keyframes mpop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.mclose{position:absolute;top:10px;right:10px;border:1px solid var(--ring);background:var(--card);
  color:var(--ink-3);border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;line-height:1}
.mclose:hover{color:var(--ink-1);border-color:var(--baseline)}
.m-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:16px 44px 10px 18px;border-bottom:1px solid var(--grid)}
.m-ch{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--card);
  background:var(--s1);padding:2px 9px;border-radius:6px;letter-spacing:.5px}
.m-ti{font-weight:800;font-size:16px;color:var(--ink-1)}
.m-who{font-size:12px;color:var(--ink-3)}
.m-body{padding:6px 18px 14px;max-height:62vh;overflow:auto}
.mh{font-size:11.5px;font-weight:700;color:var(--ink-1);background:var(--home-wash);
  padding:2px 9px;border-radius:5px;width:fit-content;margin:12px 0 6px;letter-spacing:.3px}
.mq{margin:0 0 8px;padding:8px 12px;border-left:3px solid var(--gold);
  background:linear-gradient(90deg,rgba(217,119,6,.05),transparent 55%),var(--surface-1);
  border-radius:0 8px 8px 0;font-size:13px;color:var(--ink-2);line-height:1.7}
.md{margin:2px 0 4px;font-size:13px;color:var(--ink-2);line-height:1.7}
.m-foot{display:flex;gap:8px;padding:0 18px 16px}

/* ====== 无障碍：键盘焦点一律可见（prow / nrow / 表格行原来是不可聚焦的 div） ====== */
:where(a,button,select,input,summary,[tabindex]):focus-visible,
.prow:focus-visible,.nrow:focus-visible,tr.rowsel:focus-visible{
  outline:2px solid var(--s1);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.alert{padding:8px 10px;border-radius:8px;background:var(--home-wash);
  color:var(--ink-2);font-size:12px;margin-bottom:6px}

/* ====== 触屏：命中区域撑到 ≥44px ====== */
@media (pointer:coarse){
  .btn,.chip,input.search{min-height:44px;padding:9px 14px;font-size:13px}
  .prow,.nrow{padding:10px 8px}
  .prow .dot,.nrow .d{margin-top:0}
  .prow .dot{width:11px;height:11px}
  .mclose{width:44px;height:44px;font-size:19px}
  tbody tr td{padding:10px 8px}
}

/* ====== 尊重系统「减弱动效」 ====== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  .btn:hover,.chip:hover{transform:none}
}

@media (max-width:900px){
  .maprow{gap:10px}
  .mapcard{flex:1 1 100%}
  .panel{flex:1 1 100%;min-width:0}
  .panel .pbody{max-height:none}
  h1{font-size:20px}
  .wrap{padding:0 14px 48px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>凡人修仙传 · 灵界 — 地图选点展示</h1>
  <p class="sub">底图：同人地图《灵界地图总览》（诸天图鉴阁）；圆点=地点节点（大小∝关联人数），右侧条带=独立位面。
  <b>点击节点</b>看该地人物与韩立行程；<b>搜索人物</b>反向高亮足迹；蓝线=韩立行程（序号=抵达次序）。
  共<b>79人×30节点</b>，数据源<b>人物数据库.json</b>。配套：<a href="灵界篇-纪传体时间线.html">纪传体时间线</a>。
  注：节点按底图标注近似落位；地理表述以原文为准（如原文人族居风元大陆西北角，底图绘于东北）。位面（魔界/广寒界/小修罗界/小灵天/龙岛/人界/仙界）不在灵界地理内，置于右侧条带。</p>

  <div class="card panel"><div class="pbody" id="panel"></div></div>
</div>

<div class="card" style="margin-top:14px;display:flex" id="legend"></div>

<div class="card" style="margin-top:14px;padding:12px 14px">

</div>

</div>

const QUOTES={"1261":["婉儿，这些宝物对我通过空间节点没有多大用处了。你在人界还不知道会遇到什么劫数，这些东西能助你一臂之力的。你收好吧。","南宫婉站在原地，望着二人消失的方向，眉宇间隐现一丝担心。"],"1262":["他的护身宝物已经毁掉了十之八九，连八灵尺这等灵宝都葬送在了其中。","韩立情急之下，只好采用元婴虚化之法……再将元婴自行散去，将元婴所化的庞大精元强行灌注到了身体各处。"],"1290":["此虫对韩立竟如同路人一般！将其抛掷在了这里，就自行离去了。","想当初在人界时，他不惜利用神秘小瓶苦心催育此灵虫，结果现在此虫成就了成熟体，反而根本无法控制了。"],"1311":["他是罕见的下界飞升修士，并未经服用过灭尘丹洗髓过体，所以引发的小天劫才是这种要命的两色雷劫。","仅仅几个呼吸间的工夫，就有缕缕阳光洞穿乌云射下。这小天劫，就这般硬生生的给破解了。"],"1323":["此鬼负伤下，再也无法用秘术凝固精魄，最终在和韩立的争斗中，还是被啼魂兽趁机的一吸而入。","将空间中的如此多凶魂一下吸入腹中，最后又吸了一名实力堪比化神修士的鬼王，啼魂兽原本进化的瓶颈，马上突破了，当场化为这么一只黑茧出来。"],"1460":["那名肌肤雪白的极美女子竟是当年乱星海的元瑶，旁边娇小女子自然就是其师姐，当年差点魂飞魄散的妍丽。","可是万万没想到，会在灵界异族之地重遇她们。不过看二人安然的样子，当年的还魂术竟然真的成了。"],"1512":["看来我当年在人界所留的青元剑诀，是落到了你的手中了，你应该是从人界飞升到此的飞升修士了。","只要你帮我在外面收齐了，然后在千年之内给我送进来。我就会用那一瓶冥河神乳和你交换。"],"1523":["突然一声龙吟般的啸声从巨山深处发出，巨山顶部金光一闪，浮现出一个三头六臂的巨相。","光幕中人影突然间身体一颤，体表五色霞光一阵流转后，终于睁开了双目。接着一长啸从人影口中脱口而出！……但是啸声明显欢喜异常。"],"1533":["玄天果实一端翠芒一闪，突然间射出尺许长的一道绿濛濛剑刃出来……而原来的玄天果实，此刻却赫然成了此剑的剑柄。","大惊之下的韩立，几乎是下意识的将手中剑柄猛然一抖，漫无方向的劈出了一剑去……"],"1636":["啼魂双目血红，两只硕大拳头一锤自己胸膛……竟化为了一只三目巨鬼。“刑兽”——虚空中突然响起了怪脸恐惧的尖叫。","“金篆文”“天罚神矛”——两种截然不同的声音，从韩立和黑气中同时失声传出。"],"1717":["炼虚初期的瓶颈在其花费一番工夫后，竟真的就此突破了，一举进入到了炼虚中期阶段。","他修为早在半刻钟之前就已经到了炼虚中期顶峰……再下一次的瓶颈冲击后，竟水到渠成般的一下成功了。"],"1745":["原本站在数丈外的向之礼，一见灰白光丝没入韩立身躯中，面上狞色一现，两手一掐诀，身躯骤然间爆裂而开。血肉横飞之下，一道朦朦胧胧的血影，在原处现身而出。","几个呼吸的工夫后，惨叫声嘎然而止！血影就此在火焰中化为了乌有。"],"1749":["而从风元大陆另一边走回到此地，竟已经花费了近百年时间。","韩立站在飞车上看着远处仿佛山岳般巨大的天渊城城墙，面上不由得满是复杂之色。如此多年的在族外流浪，他终于再次返回人妖两族了。"],"1756":["怪不得此人不愿加入我们谷家，原来本身就具有真灵血脉……难道对方是在突破合体瓶颈？","不过一个天外魔头分神，也想趁心魔入侵时扰乱我心神，这也太小瞧我了吧。"],"1819":["我用这头无意中得到了的冰凤，外加先前拿出的其他两样东西，换取这位道友想要的通天灵宝。","但就在这时，一个淡淡的男子声音突然间响起，仿佛人间仙乐般的传入血光人耳中。“好，我换了。”"],"1869":["只见先前万里无云的碧蓝高空，一下多出里许大小的一块巨大灰斑，并飞快扩散而开……仿佛正有什么东西在飞快侵蚀着整个天空。","“魔斑！不会错的，这一定是魔劫降临前的魔斑！”海大少脸色发白之下，忽然大声的喊道。"],"1857":["我被那雷兽所化巨禽惊醒，并无法控制的吸纳其体内天雷之力后，身躯就彻底被这一界天地之力所排斥了，恐怕顷刻间就要到那传闻中的真仙界去了。","韩立在下方虽然无法动弹，但仍能看到啼魂在光柱中勉强扭首回望了它一眼，目光含复杂异常，最终一闪的没入了那颗五色巨眼的瞳孔中。"],"1973":["这头豹麟兽竟在醒来的同时，开始了合体期的度劫。","豹麟兽度劫后幻化的人形，竟是一个比“曲儿”看起来还要年幼的女童。"],"1992":["魔族的确马上就要开始攻城了，这一次绝对不是以前的骚扰之战，所有的魔族和魔兽全都出动了，甚至连那位血光圣祖化身，似乎也出现在了魔族大军中。","“魔族圣祖已经被我等击毙，你们这些魔崽子还有何逞威的余地。魂飞魄散就是你们唯一的下场！”"],"2013":["只有用这里的节点，才能直达魔界的血石山脉中。那血石山脉即使在魔界中也是异常荒凉的地方，并没有多少魔族驻扎。","转眼间，一干人等就神不知鬼不觉的飞入了这片面积不知多广的珊瑚群岛中。"],"2112":["在大战结束的数日后，有高阶魔族在离沉水镇百万里外的一片山脉中，发现了血光圣祖惨不忍睹的残尸。","这具遗骸头颅天灵盖大开，里面空空如也，似乎血光圣祖不但肉身被毁掉，连元婴都被什么人硬生生的摄取走了。"],"2120":["玉容微微有些苍白，但那艳丽无双的容貌，赫然正是韩立在人界时的红颜“紫灵”。","但毫无疑问，在韩立认识的诸多女修中，除了南宫婉之外，最牵挂的就是此女了。"],"2183":["而在魔气上方，那些噬金虫竟还旁若无人般的互相吞噬着。如此长时间过去，整个虫群不过只剩下数百只而已，并且已经变成那些虫王向其他噬金虫大肆杀戮的场面。","这三只噬金虫，正是那数万成熟体噬金虫和十二只候选虫王互相吞噬之后，最终剩下的三只灵虫。"],"2186":["“三阳灌体，姓韩小子竟然真突破到了大乘境界！”","光茧原先所在之地，一个紫金色人影浮现而出，正是终于重铸肉身完成的韩立。"],"2242":["“这是神念之链，不可能！你……你还修炼有炼神术这门神通！这门秘术，怎可能流落到下界来了。”","“不，是天罚之雷！”……螟虫之母看似无坚不摧的身躯，竟在五色电光下寸寸的碎裂而开，不过几个呼吸间的工夫就飞灰湮灭了。"],"2247":["但是无论如何细想，却发现自己若真想在大道上有成，其实呆在魔界才是最好的。","小妹可不想韩兄到时候成功飞升仙界，成了一名真仙，而自己却还留在下界中，并在一次次天劫下只能静等陨落之时。"],"2258":["黑色虫卵在狂闪中一下寸寸碎裂而开，同时一道金光从中激射而出……一个三寸高紫金小人在高处一下现身而出。","“这就是传闻中的噬金虫王！”韩立看着紫金小人，神色不禁有些怪异起来。"],"2274":["至于豹麟兽那头小兽，因为相对韩立现在修为太低了一些，故而在出发前，将其留在圣岛好好闭关修炼去。"],"2305":["若真能到这一步，整座无涯海都算是固若金汤了，韩兄也算有一片真正的基业了。","这绿影赫然正是韩立的那具芝仙灵躯。……现在我修为大进，这具合体期灵躯并无太大作用了，送给你正好合用的。"],"2363":["此地却是天鼎宫的中枢所在，是一个被天鼎真人耗费偌大心血布置的独立空间。","在下和仙子来自同一处人界……当年我曾经进入虚天宫，并得仙子遗留虚天鼎和其他的一些好处。"],"2372":["这二人竟正是六翼霜蚣所化白袍男子和被其胁迫同行的冰凤。","不用十息，我现在就可以给你一个回答。当你灵奴！别白日做梦了。"],"2393":["“夫君，你终于找到这里了，我从不怀疑有这一天，只是如此长的等待，只是这份相思之苦实在太难挨了一些。”","“婉儿”——韩立口中吐出这两个字眼后……用手指从眼前绝美少女丝绸般光滑脸庞上轻轻一划而过，仿佛抚摸某种绝世珍宝，这一切尽在不言之中。"],"2417":["我的确感觉神魂某个原先未曾发觉的多余东西，似乎被去掉了。还是道友神通广大，小妹这个心头之患总算没了。","只要你能千年内帮我收集齐全，我就算你完成承诺，自会帮你解除血契。……今后人族若有劫难的话，你必须立下重誓会出手相帮三次。"],"2427":["一道墨绿细线一卷而出，直接斩碎马良护体灵气，从脖颈处一闪而过。骨碌碌一声响，一颗头颅干脆之极的滚落而下。","它竟然只是梵圣法相凝结而成的躯壳，韩立早和先前噬金虫王一般的脱壳而走，并潜到了马良上空，抓住时机的动用玄天之宝斩杀了这位真仙。"],"2431":["诸位道友，真魂丹我已经卖给你们一颗，怎么分配就是诸位的事情。但是我希望此事到此为止了。从今之后，若还有敢来骚扰韩某和其他族人的话，可别怪我翻脸无情了。","甚至有些对韩立有几分推崇的异族人，认为说韩立是灵界第一大乘也不算夸大的。"],"2442":["也只有设法动用专门破界的星盘，外加付出一些不小代价，才能让一缕分魂破界回到人界。","他自然正是重返人界的韩立，虽然其一缕分魂所带法力不多，但对人界来说，仍是近似元婴顶峰般的无敌般存在。"],"2446":["韩立在只隐约看到其中一道遁光中的南宫婉满是焦虑的丽容后，就感觉身躯一轻，立刻在无数金光包裹中，沿着光柱的向高空裂缝激射而去。","不知过了多久后，韩立在一股清凉之意中缓缓的张开双目……“在下高升，欢迎道友飞升来到北寒仙域！”","魔光火须子二人见此情景，也大喜的互望一眼，当即一个身躯一晃，化为一股黑气的没入韩立身体之中，一个则单手一掐诀，化为一团火球的遁入韩立大袖之内。"],"1254":["结果在准备了百多年时间后，向之礼、风老怪和呼老魔继车老妖之后，联手进入到了空间节点中。","看来银月当年所说的空间节点的危险程度，丝毫没有夸大之言，的确是一条九死一生之路。"],"1329":["韩某手中正好有一些万年玄玉，足够重新炼制飞剑了。既然许仙子和冰魄仙子真有渊源，就赠送给道友吧。也算在下还了此人情！","冰魄仙子！那是我们许家许久之前的先祖了，前辈如何知道的。"],"1354":["我来介绍一下，这位是我们两族派往木族的卧底，叶楚道友。","道友还真是眼光犀利。在下是人族之身，但身具木凤灵血，算半个妖族吧。"],"1356":["很简单，在知道阁下身份有问题后，才如此做的。就不知该继续称呼你雷罗真人，还是该叫你一声紫影大人。","天元兄！多亏你相借神香，否则这孽障还真不好除去的。"],"1396":["很简单，我二人就以刚才争执之事为赌注，分别出手诛杀这二人，谁先得手，就算谁赢得赌注如何？","不如各自派出自身的一个猖奴动手如何。如此一来，想来这两名人族也能应付一下，足够你我分出胜负的。"],"1479":["韩兄若是再来晚上一些，恐怕就见不到我二人了。","只要趁机找到一处精纯阴气凝结之地，替我驱除掉体内标记。偌大的冥河之地，鬼婆等人想找我们，可是大海捞针一般的。"],"1578":["你……你是向师兄！你还活着，怎会在此的！","向某如今情况，也根本丧失了冲击炼虚的可能，也不打算再冒什么风险，已经打算就在此地终老一生了。"],"1741":["你和冰魄仙子是什么关系，体内竟能有冰魄道友的虚灵宝鼎。","之所以叫你留下，是想让你回人族后，替我找到冰魄仙子，捎带一物和一枚信笺而已。"],"1773":["“噗”的一声，一根血丝从瓶口中一喷而出，在许蛟法决一催下，奔血池上空的晶棺激射而去。","接着此女长长睫毛一动之下，缓缓的睁开了美目，一对血色瞳孔在众人眼前一下呈现而出，闪动着毫无感情的寒光。"],"1809":["黛儿，果然是你这丫头！","韩大叔，我现在模样，不知和南宫姑姑相比有几分相似了。"],"1837":["况且我将你冰凤师姑也留在了洞府中，在修炼上也能指点他们一二的。","以冰凤师姑的修为，自然完全可以指点两位师兄的。"],"1886":["这样吧，谷兄若是放心，妾身就跑上一趟吧。我和天皇宗的林仙子是结交多年的好友，去助其一臂之力也是应该的。","这倚天城关系非小，韩某略尽些人力原本就是应该的。事不宜迟，我和银光道友略回去收拾一下，明日就出发如何！"],"1910":["本尊终于到了人界了，此种方法果然可行的。哈哈，大概是本圣祖是第一个能做到此事的人。","参见圣祖大人，恭喜圣祖大人降临灵界！"],"1937":["虚天鼎，虚灵鼎，虚皇鼎！哼，那几个家伙恐怕不知道，当初出发前本仙子刚好又仿制出了另外一只宝鼎。","正是韩立当年持之依仗的虚天鼎，而这娇媚的血甲女子，自然就是那位冰魄仙子血魂所化的血灵化身了。"],"1965":["不错，在下这次外出虽然遇到了一些危险，但同样也有了一些机缘，已经可以冲击合体后期瓶颈了。如今恐怕需要借道友的天凤元阴一用了。","当初要不是韩兄出手相救，妾身还不知沦为哪一人的灵兽……现在助韩兄冲破瓶颈，自是理所当然之事。"],"2050":["素女轮回功是家母所传授！","韩立一想到发妻，纵然修为已经修炼到现在的地步，也胸口不禁一阵异样的火热，恨不得马上插翅飞到南宫婉身边，好好倾诉一番相思之苦。"],"2095":["没想到，如此多年没见，元魇道友竟然还是这般大口气。妾身如今也在此岛上，是不是也打算一起斩杀掉了。","你若是没有将这件黑魔匕带在身上，我说不定还真有其他想法，但现在吗，我只是冲此人来的。"],"2101":["元魇前辈，只要肯答应不阻拦我进入洗灵池和寻找净灵莲，你要的炼魔草，我同样会在事后相赠的。","“好，本座也答应了。”元魇圣祖被宝花的言语一下提醒到了……终于一咬牙的也点了下头。"],"2110":["好，但不管有没有成功，以你供奉的仙露效力，我只能全力出手两次。你可确定？","祭品符合要求，我可以出手三击。第一击！"],"2123":["而等我飞升到魔界见到六极本人后，才真正知道她帮助我，只是想为自己多准备一具候选的化身之体而已。","我在六极这缕神念劝说下，最终被其借助那密地中残留的一些真魔气，进行了魔气灌体从而改修了魔道功法，还一日千里的进阶到了化神境界。"],"2133":["我不能不亲自过来一趟了。我师傅六极已经到了蓝瀑湖，并且不久前还召唤我带着所有手下赶过去相见！","只要我能进阶成功，一定马上返回魔界，将你从六极门下救出。"],"2145":["元刹，你若真有本事将我这把老骨头留下，老夫也不会出现在此地了。但现在的情形是，老夫加上这两位道友的话，不知你还能有几分胜算了。","在他旁边的银发女子，自然就是当年韩立人界昆吾山一别后，就再未见过的银月，也就是灵界的那位“玲珑仙子”。"],"2171":["玲珑！你过来。按照先前的约定，我将她也交给你了。希望你早日将秘术修成，好能压制住她体内的功法反噬之苦。","玲珑，以后暂时要听韩道友的吩咐，在没有我的亲口吩咐前，不得轻易离开其身边。否则，你也不要认我这个祖父了。"],"2188":["这样吧，你就将我那头六翼霜蚣的下落告诉韩某一二，就算结清了此事。","照你所说，六翼霜蚣得了你的逆灵真阴大法，不但已经进阶合体，甚至连以后进阶大乘都有一分可能的。"],"2190":["至于在下本体，正是真龙之一的紫睛龙！不过前些日在界面间遇到一名大敌，才不得已躲在此地一二的！","在下樊咆子，见过道友！不知道友尊姓大名。贵族的莫道友，和我可是有过一面之缘的。"],"2202":["本座这次来，一是为了想看看韩道友到底是何等人物。……二则是想向道友讨要一个人。不，现在我改变主意，打算讨要两个人了。","好，既然是恶客，那韩某作为主人，说不得只有亲自出手驱除，给一些教训了。"],"2205":["前辈明鉴，晚辈是奉冰魄先祖血魂之命，才将虚天鼎当做贺礼奉给前辈的。","血魂前辈却吩咐族中弟子将这只虚天鼎立刻给前辈送来，并希望前辈能带着此鼎到许家一趟。"],"2246":["现在你的六大化身，已经被我斩杀了个干干净净。而你本体也已经困在了玄天灵域中。现在就是有通天的本事，你也休想再翻身了。","好了，陪你说了这般多话，让你能够活到现在，我也算对你仁至义尽了。下面，我就好好送你上路吧。"],"2265":["好吧。我不管你如何得到的这件信物，那这次交易就也算上你们两个吧。不过你们是否真的能如愿以偿，还要看你们自己的本事了。","嘿嘿，不是我小看莫道友。单凭你的本事，想要完成这笔交易几乎是不可能的事情。倒是你旁边的这位，还有那么两三分可能的。"],"2304":["什么，我祖父七天后，就要度劫了。怎会来的这般快，不是应该还有一段时间的吗？","不过此刻，玉牌上的背影赫然遍布密密麻麻的裂纹。……几个呼吸间工夫后，整块玉牌就一下化为粉末的从手指间散落而下。"],"2312":["这次天劫，只有瑶儿才能帮上忙。瑶儿跟我过去。妍丽，你留在此地多加小心警戒一二。","瑶儿，你苦修那门神通如此多年，并最终进阶到合体境界，不就是为了想今日能报他老人家大恩吗。可惜我并非天阴之体，无法为师父渡劫尽上丝毫力量的。"],"2313":["这黄袍男子自然就是那黄元子，旁边二人则是另外两名赫赫有名的大乘强者“不灭天尊”和“三全道人”。","这一次，我和青元子只能有一人可以活着离开此空间。"],"2331":["我若是没有看走眼的话，这金龙的原形应该只是一滴灵血而已。","竟然真有人在拍卖会上动手，和黑袍男子硬生生配合的劫走了灵血。"],"2335":["原来韩兄早已看穿了小妹的掩饰，既然有此要求，那下次小妹就以真容相见吧。对了，小妹真名叫田飞儿，一样请道友铭记在心了。","它的确是一滴精血，但并非祖龙之血，而是魇龙之血。"],"2371":["愚蠢，在我万灵血玺威能笼罩下，又怎可能让一名区区大乘真跑掉。镇！","但若是此界其他大乘都是你们三个这样的水准，只要多花费些时间，全都杀掉也不是多难的事情。"],"2403":["数以万计的人妖两族修士全都拜伏在青石地面上，恭迎韩立这位祖师的归来。","哦，银月妹妹还在闭关，真是太可惜了。我还想和她好好聚聚，再聊一聊当年在人界的诸多事情。"],"2441":["韩道友，你还是如约而来了。看来炼神术的弊处，你已经再无任何怀疑了。","既然这样，你当初的条件，我答应了。前辈将炼神术第三层修炼之法如实相告吧。"],"2443":["呵呵，看来韩某来的正是时候。有旧友远来，想来凌仙子不会连杯水酒都不给一盏吧。","于是下面的时间，这位星宫之主和韩立在大殿中一呆就是半日之久。"],"2445":["另有十几名修为高低不一的男女站在一艘漆黑巨舟前方，其中三名风姿各异的绝色女子，神色凝重的眺望向荒岛中心处。正是南宫婉、元瑶、银月三女。","在三女稍后些的地方，冰凤带着器灵子、海大少、白果儿等一干门下弟子站在那里。"]};
const modalEl=document.getElementById("modal"),
      mCh=document.getElementById("mCh"),mTitle=document.getElementById("mTitle"),
      mWho=document.getElementById("mWho"),mBody=document.getElementById("mBody"),
      mClose=document.getElementById("mClose");
let lastFocus=null;
function openModal(c,l,d,who){
  if(typeof tipEl!=="undefined")tipEl.style.display="none";lastFocus=document.activeElement;
  mCh.textContent=`第 ${c} 章`;mTitle.textContent=l;mWho.textContent=who||"";
  mBody.innerHTML="";
  const qs=QUOTES[String(c)];
  if(qs&&qs.length){htm("div","mh",mBody,"原文精炼");qs.forEach(q=>htm("div","mq",mBody,q));}
  if(d){htm("div","mh",mBody,qs&&qs.length?"综述":"事件综述");htm("div","md",mBody,d);}
  modalEl.classList.add("on");
  document.documentElement.style.overflow="hidden";
  mClose.focus();
}
function closeModal(){modalEl.classList.remove("on");
  document.documentElement.style.overflow="";
  if(lastFocus&&lastFocus.focus)lastFocus.focus();}
mClose.addEventListener("click",closeModal);
modalEl.addEventListener("click",ev=>{if(ev.target===modalEl)closeModal();});
/* 焦点陷阱：Tab 在弹窗内循环 */
modalEl.addEventListener("keydown",ev=>{
  if(ev.key!=="Tab")return;
  const f=[...modalEl.querySelectorAll(
    "button,[href],input,select,textarea,[tabindex]:not([tabindex='-1'])")]
    .filter(n=>!n.disabled&&n.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
  else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&modalEl.classList.contains("on"))closeModal();});
const NS="http://www.w3.org/2000/svg";
/* 令牌读取带缓存：切换主题/模式时会成百次调用 css()，每次 getComputedStyle 都会触发样式重算 */
const _tok=new Map();
const css=v=>{let c=_tok.get(v);if(c===undefined){
  c=getComputedStyle(document.documentElement).getPropertyValue(v).trim();_tok.set(v,c);}return c;};
const clearTok=()=>_tok.clear();
const RM=window.matchMedia("(prefers-reduced-motion: reduce)");
const reveal=(el,block)=>{if(el)el.scrollIntoView({behavior:RM.matches?"auto":"smooth",block:block||"start"});};

const GRP_COLOR={g1:"--s1",g2:"--s2",g3:"--s3",g4:"--s4",g5:"--s5",g6:"--s6",g7:"--s7",g8:"--s8",
  core:{hanli:"--s1",wan:"--s2",bingfeng:"--s3",ziling:"--s4",yuan:"--s5",xiang:"--s6",yinyue:"--s7",bingpo:"--s8"}};
const pColor=p=>p.core?css(GRP_COLOR.core[p.id]||"--s1"):css(GRP_COLOR[p.grp]);
const grpName=g=>DATA.groups[g]||"";
const state={mode:"img",selNode:null,selPerson:null,route:true,theme:"auto"};
const THEME_LABEL={auto:"跟随系统",light:"浅色",dark:"深色"};
/* 恢复上次的主题与图层开关 */
(function(){
  const t=store.get("theme","auto");
  if(["auto","light","dark"].includes(t))state.theme=t;
  if(state.theme!=="auto")document.documentElement.setAttribute("data-theme",state.theme);
  const r=store.get("route",null); if(typeof r==="boolean")state.route=r;
  const m=store.get("mode",null); if(m==="img"||m==="sch")state.mode=m;
})();
/* 键盘可达的点击替身：Enter / 空格等同点击 */
function onActivate(node,fn){
  node.tabIndex=0;node.setAttribute("role","button");
  node.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();fn();}});
}
const svg=document.getElementById("map"), tipEl=document.getElementById("tip"),
      panel=document.getElementById("panel");
panel.tabIndex=-1;                    /* 供键盘选择后把焦点移进来，朗读新内容 */
function el(n,at,parent){const e=document.createElementNS(NS,n);
  for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;}
function htm(n,cls,parent,txt){const e=document.createElement(n);if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e;}
const NC=n=>state.mode==="img"?{x:n.ix,y:n.iy}:{x:n.x,y:n.y};

const byNode={}; DATA.nodes.forEach(n=>byNode[n.id]={node:n,persons:[],hanli:[]});
DATA.persons.forEach(p=>{
  const seen={};
  p.spans.forEach(s=>{
    const b=byNode[s[2]];if(!b)return;
    if(!seen[s[2]]){seen[s[2]]=1;b.persons.push(p);}
    if(p.id==="hanli")b.hanli.push(s);
  });
});

function drawBase(){
  /* 重绘会重建整个 SVG，记住当前聚焦的节点，事后还回去 */
  const act=document.activeElement, fk=act&&act.dataset&&act.dataset.id?act.dataset.id:null;
  svg.innerHTML="";
  if(state.mode==="img"){
    /* 底图优先 webp（约 235KB，PNG 为 2.7MB）；加载失败自动回退 PNG */
    const im=el("image",{href:"灵界地图总览.webp",x:0,y:0,width:1587,height:1123,
      preserveAspectRatio:"xMidYMid meet"},svg);
    im.addEventListener("error",function onErr(){
      im.removeEventListener("error",onErr);
      im.setAttribute("href","灵界地图总览.png");
      im.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","灵界地图总览.png");
    });
  }else{
    const g0=el("g",{transform:"scale(1.22,1.26)"},svg);
    const land=(x,y,w,h,label,dx,dy)=>{
      el("rect",{x,y,width:w,height:h,rx:36,fill:css("--home-wash"),
        stroke:css("--baseline"),"stroke-width":1.5},g0);
      const t=el("text",{x:x+dx,y:y+dy,class:"clabel"},g0);t.textContent=label;
    };
    land(470,205,690,595,"风 元 大 陆",18,40);
    land(60,240,360,460,"雷鸣大陆",16,36);
    land(710,40,350,135,"血天大陆",14,30);
    const t=el("text",{x:600,y:455,class:"clabel","text-anchor":"middle"},g0);t.textContent="中央海域";
  }
  /* 位面条带（两种模式同位）：竖向脊线串联 + 双层圈 */
  const g1=el("g",{},svg);
  const planes=DATA.nodes.filter(n=>n.kind==="plane").slice().sort((a,b)=>a.iy-b.iy);
  el("text",{x:1745,y:34,class:"planetag","text-anchor":"middle"},g1).textContent="独立位面";
  if(planes.length>1)
    el("line",{x1:planes[0].ix,y1:planes[0].iy,x2:planes[0].ix,
      y2:planes[planes.length-1].iy,stroke:css("--plane-edge"),"stroke-width":1.5,
      "stroke-dasharray":"3 5",opacity:.55},g1);
  planes.forEach(n=>{
    const gp=el("g",{class:"node","data-id":n.id},g1);
    el("circle",{cx:n.ix,cy:n.iy,r:50,fill:css("--plane-wash"),stroke:css("--plane-edge"),
      "stroke-width":1.5,"stroke-dasharray":"5 4"},gp);
    el("circle",{cx:n.ix,cy:n.iy,r:42,fill:"none",stroke:css("--plane-edge"),
      "stroke-width":1,opacity:.45},gp);
    n.name.split("·").slice(0,2).forEach((s2,i)=>{
      el("text",{x:n.ix,y:n.iy-12+i*18,class:"nlabel sub","text-anchor":"middle"},gp).textContent=s2;
    });
    attach(gp,n);
  });
  const g2=el("g",{},svg);
  DATA.nodes.filter(n=>n.kind!=="plane").forEach(n=>{
    const cnt=byNode[n.id].persons.length;
    const r=Math.max(8,Math.min(17,6+cnt*0.6));
    const {x,y}=NC(n);
    const gp=el("g",{class:"node","data-id":n.id},g2);
    el("circle",{cx:x,cy:y,r:r+3,fill:"none",stroke:css("--card"),"stroke-width":1.5,opacity:.85},gp);
    el("circle",{cx:x,cy:y,r,class:"ndot",fill:css("--ink-1")},gp);
    const below=(y<1123*0.62);
    el("text",{x,y:below?y+r+15:y-r-8,class:"nlabel","text-anchor":"middle"},gp)
      .textContent=n.name.split("·")[0];
    attach(gp,n);
  });
  drawRoute();
  if(fk){const back=svg.querySelector(`.node[data-id="${fk}"]`);if(back)back.focus({preventScroll:true});}
}
function routePoints(){
  const seq=[];DATA.persons.find(p=>p.id==="hanli").spans.forEach(s=>{
    if(!seq.length||seq[seq.length-1]!==s[2])seq.push(s[2]);});
  if(seq[seq.length-1]!=="wuyahai")seq.push("wuyahai");
  return seq;
}
let routeG=null;
function drawRoute(){
  if(routeG){routeG.remove();routeG=null;}
  if(!state.route)return;
  routeG=el("g",{class:"route"},svg);
  const seq=routePoints();
  const s1=css("--s1"),cardC=css("--card");
  /* 分段绘制：大陆段=白衬实线；进出位面段=虚线淡化（避免斜线横穿地图搅乱底图） */
  for(let i=0;i<seq.length-1;i++){
    const a=byNode[seq[i]].node,b=byNode[seq[i+1]].node;
    const pa=NC(a),pb=NC(b);
    const planeSeg=a.kind==="plane"||b.kind==="plane";
    if(!planeSeg)
      el("line",{x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y,stroke:cardC,"stroke-width":5.5,
        opacity:.8,"stroke-linecap":"round"},routeG);
    el("line",{x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y,stroke:s1,
      "stroke-width":planeSeg?1.6:2.6,opacity:planeSeg?.45:.92,
      "stroke-dasharray":planeSeg?"6 5":"none","stroke-linecap":"round"},routeG);
  }
  seq.forEach((id,i)=>{
    const {x,y}=NC(byNode[id].node);
    el("circle",{cx:x,cy:y-2,r:9.5,fill:s1,stroke:cardC,
      "stroke-width":2,opacity:.96},routeG);
    el("text",{x,y:y+1.6,"text-anchor":"middle","font-size":"10.5",
      fill:cardC,"font-weight":"700"},routeG).textContent=i+1;
  });
  const w=NC(byNode.wuyahai.node),c=NC(byNode.xianjie.node);
  const dPath=`M${w.x+22},${w.y} C ${w.x+430},${w.y-140} ${c.x-70},${c.y+150} ${c.x-48},${c.y+8}`;
  el("path",{d:dPath,fill:"none",stroke:cardC,"stroke-width":4.5,opacity:.7},routeG);
  el("path",{d:dPath,fill:"none",stroke:s1,"stroke-width":2,
    "stroke-dasharray":"5 5",opacity:.8},routeG);
  el("text",{x:w.x+300,y:w.y-90,"font-size":"12",fill:s1,"font-weight":700},routeG)
    .textContent="飞升 ▷";
}
function attach(gp,n){
  const b=byNode[n.id];
  gp.setAttribute("aria-label",`${n.name}，${n.region}，关联${b.persons.length}人`+
    (b.hanli.length?`，韩立经此${b.hanli.length}段`:"")+"（回车查看）");
  const fill=()=>{
    tipEl.style.display="block";tipEl.innerHTML="";
    htm("div","t1",tipEl,n.name);
    htm("div","",tipEl,`${n.region} · 关联${b.persons.length}人`+
      (b.hanli.length?` · 韩立经此${b.hanli.length}段`:""));
  };
  const place=(px,py)=>{
    const w2=tipEl.offsetWidth,h2=tipEl.offsetHeight;
    let x=px+14,y=py-h2-8;
    if(x+w2>innerWidth-8)x=px-w2-14;
    if(y<8)y=py+16;
    tipEl.style.left=x+"px";tipEl.style.top=y+"px";
  };
  gp.addEventListener("pointermove",ev=>{fill();place(ev.clientX,ev.clientY);});
  gp.addEventListener("pointerleave",()=>tipEl.style.display="none");
  /* 键盘聚焦时同样给概要提示，交互不再只对鼠标开放 */
  gp.addEventListener("focus",()=>{fill();const r=gp.getBoundingClientRect();
    place(r.left+r.width/2,r.top-6);});
  gp.addEventListener("blur",()=>tipEl.style.display="none");
  gp.addEventListener("click",()=>selectNode(n.id));
  onActivate(gp,()=>selectNode(n.id,true));
}
function selectNode(id,viaKey){state.selNode=id;state.selPerson=null;renderSel();showNodePanel(id);
  if(viaKey)panel.focus();}
function selectPerson(id,viaKey){state.selPerson=id;state.selNode=null;renderSel();showPersonPanel(id);
  if(viaKey)panel.focus();}
function renderSel(){
  document.querySelectorAll(".node").forEach(g=>g.classList.remove("dim","hl"));
  if(state.selPerson){
    const p=DATA.persons.find(x=>x.id===state.selPerson);
    const mine={};p.spans.forEach(s=>mine[s[2]]=1);
    document.querySelectorAll(".node").forEach(g=>{
      if(mine[g.dataset.id])g.classList.add("hl");else g.classList.add("dim");});
    const cf=document.getElementById("curFilter");
    cf.style.display="";cf.querySelector(".nm").textContent=p.name;
    cf.querySelector(".dot").style.background=pColor(p);
  }else document.getElementById("curFilter").style.display="none";
  if(state.selNode){
    const g=document.querySelector(`.node[data-id="${state.selNode}"]`);
    if(g)g.classList.add("hl");
  }
}
function showNodePanel(id){
  const b=byNode[id],n=b.node;
  panel.innerHTML="";
  htm("h3","",panel,n.name);
  htm("div","reg",panel,n.region+"（节点为近似落位）");
  htm("div","desc",panel,n.desc);
  if(b.hanli.length){
    htm("h4","",panel,"韩立经此");
    /* 原来是纯文本、却和人物面板里可点击的事件条长得一模一样——有原文可查时才做成可点 */
    b.hanli.forEach(s=>{
      const row=htm("div","evq",panel,`第${s[0]}–${s[1]}章`);
      const qs=QUOTES[String(s[0])];
      if(qs&&qs.length){
        row.classList.add("clickable");
        row.title="点击查看原文精炼弹窗";
        const fire=()=>openModal(s[0],`${n.name} · 韩立经此`,
          `韩立在此盘桓于第${s[0]}–${s[1]}章（${n.name}）。`,"韩立 · 本纪");
        row.addEventListener("click",fire);
        onActivate(row,fire);
      }
    });
  }
  htm("h4","",panel,`此地人物（${b.persons.length}）`);
  const list=htm("div","plist",panel);
  b.persons.slice().sort((a,c2)=>(a.core?0:1)-(c2.core?0:1)||a.tier-c2.tier||a.name.localeCompare(c2.name,"zh"))
   .forEach(p=>{
    const r=htm("div","prow",list);
    r.addEventListener("click",()=>selectPerson(p.id));
    onActivate(r,()=>selectPerson(p.id,true));
    const d=htm("span","dot",r);d.style.background=pColor(p);
    const box=htm("span","",r);
    htm("div","nm",box,p.name+(p.core?"（核心列传）":""));
    const sps=p.spans.filter(s=>s[2]===id).map(s=>s[0]===s[1]?s[0]:s[0]+"–"+s[1]).join("、");
    htm("div","sp",box,`第${sps}章 · ${p.core?DATA.groups.core:grpName(p.grp)}`);
    if(p.tier===2&&!p.core)htm("div","sp",box,p.who);
    r.setAttribute("aria-label",`${p.name}，第${sps}章（回车查看人物足迹）`);
  });
}
function showPersonPanel(id){
  const p=DATA.persons.find(x=>x.id===id);
  panel.innerHTML="";
  htm("h3","",panel,p.name);
  htm("div","reg",panel,(p.core?DATA.groups.core:grpName(p.grp))+(p.tier===2?" · 重点人物":""));
  htm("div","desc",panel,p.core?p.who+"（详见时间线页列传）":p.who);
  htm("h4","",panel,"足迹（点击定位）");
  const nl=htm("div","nlist",panel);
  const seen={};
  p.spans.forEach(s=>{
    if(seen[s[2]])return;seen[s[2]]=1;
    const n=byNode[s[2]].node;
    const r=htm("div","nrow",nl);
    r.addEventListener("click",()=>selectNode(s[2]));
    onActivate(r,()=>selectNode(s[2],true));
    const d=htm("span","d",r);d.style.background=pColor(p);
    htm("span","",r,n.name);
    const sps=p.spans.filter(x=>x[2]===s[2]).map(x=>x[0]===x[1]?x[0]:x[0]+"–"+x[1]).join("、");
    htm("span","t",r,`第${sps}章`);
    r.setAttribute("aria-label",`${n.name}，第${sps}章（回车查看该地人物）`);
  });
  if(p.events.length){
    htm("h4","",panel,"关键事件");
    p.events.forEach(e=>{
      const q=htm("div","evq",panel);
      q.classList.add("clickable");
      const b1=document.createElement("b");
      b1.textContent=`第${e[0]}章 · ${e[1]}`+(e[3]?`（${byNode[e[3]].node.name.split("·")[0]}）`:"");
      q.appendChild(b1);
      if(e[2]){const br=document.createElement("br");q.appendChild(br);q.appendChild(document.createTextNode(e[2]));}
      q.title="点击查看原文精炼弹窗";
      const fire=()=>openModal(e[0],e[1],e[2],
        p.name+"（"+(p.core?DATA.groups.core:grpName(p.grp))+"）");
      q.addEventListener("click",fire);
      onActivate(q,fire);
    });
  }
}
const dl=document.getElementById("plist");
DATA.persons.slice().sort((a,b)=>a.name.localeCompare(b.name,"zh")).forEach(p=>{
  const o=document.createElement("option");o.value=p.name;dl.appendChild(o);});
const searchEl=document.getElementById("search");
function runSearch(){
  const q=searchEl.value.trim();
  if(!q)return;
  const p=DATA.persons.find(x=>x.name===q)||DATA.persons.find(x=>x.name.includes(q));
  if(p){selectPerson(p.id);return;}
  /* 原来查不到是静默失败，用户无从判断；这里给出明确反馈 */
  state.selPerson=null;state.selNode=null;renderSel();
  panel.innerHTML="";
  const box=htm("div","alert",panel,
    `未找到「${q}」。可试人物本名（如“韩立”“南宫婉”“啼魂兽”），或在下方「地点 × 人物 总表」中查找。`);
  box.setAttribute("role","status");
  panel.focus();
}
searchEl.addEventListener("change",runSearch);
searchEl.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"){ev.preventDefault();runSearch();}
  else if(ev.key==="Escape"){searchEl.value="";searchEl.blur();}
});
function panelEmpty(){
  panel.innerHTML="";
  const e=htm("div","",panel,"点击地图节点查看该地人物与韩立行程；或搜索人物反向定位。");
  e.style.cssText="color:var(--ink-3);padding:28px 10px;text-align:center;line-height:1.9";
}
document.getElementById("clearF").addEventListener("click",()=>{
  state.selPerson=null;state.selNode=null;renderSel();
  document.getElementById("search").value="";
  panelEmpty();
});
document.getElementById("routeBtn").addEventListener("click",ev=>{
  state.route=!state.route;
  store.set("route",state.route);
  ev.currentTarget.setAttribute("aria-pressed",state.route?"true":"false");
  ev.currentTarget.textContent="韩立行程："+(state.route?"开":"关");
  drawRoute();
});
document.getElementById("modeBtn").addEventListener("click",ev=>{
  state.mode=state.mode==="img"?"sch":"img";
  store.set("mode",state.mode);
  ev.currentTarget.textContent=state.mode==="img"?"底图：实景图 ⇄ 示意图":"底图：示意图 ⇄ 实景图";
  drawBase();renderSel();
  if(state.selNode)showNodePanel(state.selNode);
  else if(state.selPerson)showPersonPanel(state.selPerson);
});
document.getElementById("themeBtn").addEventListener("click",ev=>{
  state.theme=state.theme==="auto"?"light":state.theme==="light"?"dark":"auto";
  ev.currentTarget.textContent="主题："+THEME_LABEL[state.theme];
  if(state.theme==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",state.theme);
  store.set("theme",state.theme);
  clearTok();          /* 换色后令牌缓存必须失效 */
  drawBase();renderSel();
  if(state.selNode)showNodePanel(state.selNode);
  else if(state.selPerson)showPersonPanel(state.selPerson);
});
/* 工具栏文案与实际状态对齐（状态可能来自本地记忆） */
(function(){
  const rb=document.getElementById("routeBtn");
  rb.setAttribute("aria-pressed",state.route?"true":"false");
  rb.textContent="韩立行程："+(state.route?"开":"关");
  document.getElementById("themeBtn").textContent="主题："+THEME_LABEL[state.theme];
  if(state.mode==="sch")
    document.getElementById("modeBtn").textContent="底图：示意图 ⇄ 实景图";
})();
(function(){
  const lg=document.getElementById("legend");
  const s=htm("span","sec",lg,"人物色：");
  [["核心列传","--ink-1"],...Object.keys(DATA.groups).filter(g=>g!=="core").map(g=>[grpName(g),GRP_COLOR[g]])]
   .forEach(([nm,c])=>{const it=htm("span","it",lg);
     const d=htm("span","dot",it);d.style.background=`var(${c})`;htm("span","",it,nm);});
  htm("span","sec",lg,"图层：");
  htm("span","",lg,"圆点大小∝关联人数 · 虚线圆=独立位面（图侧条带） · 蓝线=韩立行程 · 节点位置为近似落位");
})();
(function(){
  const w=document.getElementById("tablewrap");
  const tb=document.createElement("table");
  tb.innerHTML='<thead><tr><th scope="col">地点</th><th scope="col">区域</th>'
    +'<th scope="col">关联人物</th></tr></thead>';
  const body=document.createElement("tbody");
  DATA.nodes.forEach(n=>{
    const b=byNode[n.id];if(!b.persons.length)return;
    const tr=document.createElement("tr");
    tr.className="rowsel";tr.style.cursor="pointer";
    /* 行也是可聚焦的：表格行不能加 role=button（会破坏表格语义），只补 tabindex + 回车 */
    tr.tabIndex=0;
    tr.setAttribute("aria-label",`${n.name}，${n.region}，关联 ${b.persons.length} 人（回车在地图中定位）`);
    const go=()=>{selectNode(n.id,true);reveal(document.querySelector(".mapcard"),"center");};
    tr.addEventListener("click",go);
    tr.addEventListener("keydown",ev=>{
      if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go();}});
    const td1=document.createElement("td");td1.innerHTML="<b></b>";
    td1.querySelector("b").textContent=n.name;
    const td2=document.createElement("td");td2.textContent=n.region;
    const td3=document.createElement("td");
    td3.textContent=b.persons.map(p=>p.name).join("、");
    tr.append(td1,td2,td3);body.appendChild(tr);
  });
  tb.appendChild(body);w.appendChild(tb);
})();
drawBase();
panelEmpty();
</script>
</body>
</html>
